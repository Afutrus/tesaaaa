```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bongkar Koin - Neo Party</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background-color: #ffffcc;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .main-container {
            background-image: url('/header-image.png');
            background-size: cover;
            background-position: center;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-popup {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border: 2px solid rgba(51, 204, 255, 0.5);

            box-shadow:
                0 8px 32px 0 rgba(31, 38, 135, 0.2);
        }
    </style>
</head>

<body>

    <div class="max-w-[800px] mx-auto relative">

        <div class="main-container p-6">

            <div class="glass-popup w-full max-w-[500px] rounded-[40px] p-8 flex flex-col items-center text-center">

                <!-- GAMBAR -->
                <div class="relative w-44 h-44 mb-5 border-4 border-[#33ccff] rounded-3xl overflow-hidden bg-white/50 shadow-lg">
                    <img
                        src="/idbos.png"
                        alt="ID Bos"
                        class="w-full h-full object-contain"
                    >
                </div>


                <!-- JUDUL -->
                <h2 class="text-[#064B7F] text-2xl font-black mb-2 uppercase italic">
                    BONGKAR KOIN
                </h2>

                <p class="text-[#13AAB3] font-bold mb-6 bg-white/50 px-4 py-1 rounded-full border border-[#33ccff]">
                    Masukkan data bongkar
                </p>


                <!-- FORM -->
                <div class="w-full space-y-4 mb-8 text-left">

                    <!-- ID PEMAIN -->
                    <div>
                        <label
                            class="block text-[#064B7F] font-bold text-sm ml-2 mb-1"
                        >
                            ID Pemain:
                        </label>

                        <input
                            type="text"
                            id="player_id"
                            inputmode="numeric"
                            placeholder="Masukkan ID pemain..."
                            class="w-full p-3 bg-white/70 rounded-2xl border-2 border-[#33ccff] outline-none focus:border-[#FD7100] transition-colors font-bold text-[#064B7F]"
                        >
                    </div>


                    <!-- JUMLAH CHIP -->
                    <div>
                        <label
                            class="block text-[#064B7F] font-bold text-sm ml-2 mb-1"
                        >
                            Jumlah Koin / Chip:
                        </label>

                        <input
                            type="number"
                            id="coin_amount"
                            min="1"
                            placeholder="Masukkan jumlah koin..."
                            class="w-full p-3 bg-white/70 rounded-2xl border-2 border-[#33ccff] outline-none focus:border-[#FD7100] transition-colors font-bold text-[#064B7F]"
                        >
                    </div>

                </div>


                <!-- BUTTON -->
                <button
                    onclick="goToDetail()"
                    class="w-48 hover:scale-105 active:scale-95 transition-all"
                >
                    <img
                        src="/ok.png"
                        alt="Lanjut"
                        class="w-full"
                    >
                </button>

            </div>

        </div>

    </div>


    <script>

        function goToDetail() {

            const playerID =
                document.getElementById('player_id').value.trim();

            const coinAmount =
                document.getElementById('coin_amount').value.trim();


            // Validasi ID
            if (!playerID) {
                alert("Harap masukkan ID pemain!");
                document.getElementById('player_id').focus();
                return;
            }


            // Validasi jumlah
            if (!coinAmount || Number(coinAmount) <= 0) {
                alert("Harap masukkan jumlah koin yang ingin dibongkar!");
                document.getElementById('coin_amount').focus();
                return;
            }


            /*
             * Langsung menuju detailv2.html
             *
             * Data:
             * id  = ID pemain
             * pay = jumlah koin/chip
             */

            const nextUrl =
                new URL('detailv2.html', window.location.origin);

            nextUrl.searchParams.set('id', playerID);
            nextUrl.searchParams.set('pay', coinAmount);

            window.location.href = nextUrl.toString();
        }

    </script>

</body>
</html>
```
