<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bongkar Pesanan - Neo Party</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background-color: #ffffcc;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .main-container {
            background-image: url('/header-image.png');
            background-size: cover;
            background-position: center;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-popup {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border: 2px solid rgba(51, 204, 255, 0.5);

            box-shadow:
                0 8px 32px 0 rgba(31, 38, 135, 0.2);
        }

        .receipt-row {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(51, 204, 255, 0.4);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
        }

        .modal-overlay.show {
            display: flex;
        }

        .confirm-modal {
            width: 100%;
            max-width: 500px;

            max-height: 90vh;
            overflow-y: auto;

            background: rgba(255, 255, 255, 0.96);

            border: 2px solid #33ccff;
            border-radius: 30px;

            padding: 26px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);

            animation: popup 0.2s ease-out;
        }

        @keyframes popup {
            from {
                opacity: 0;
                transform: scale(0.94);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .confirm-button {
            background: #FD7100;
            color: white;

            width: 100%;
            padding: 14px;

            border-radius: 16px;

            font-weight: 900;

            transition: 0.2s;
        }

        .confirm-button:hover {
            background: #e96500;
            transform: scale(1.02);
        }

        .cancel-button {
            background: #e5e7eb;
            color: #374151;

            width: 100%;
            padding: 14px;

            border-radius: 16px;

            font-weight: 900;

            transition: 0.2s;
        }

        .cancel-button:hover {
            background: #d1d5db;
        }

        .status {
            display: none;
        }

        .status.show {
            display: block;
        }
    </style>
</head>


<body>

<div class="max-w-[800px] mx-auto relative">

    <div class="main-container p-6">

        <div class="glass-popup w-full max-w-[500px] rounded-[40px] p-8 flex flex-col items-center text-center">

            <!-- IMAGE -->

            <div class="relative w-44 h-44 mb-4 border-4 border-[#33ccff] rounded-3xl overflow-hidden bg-white/50 shadow-lg">

                <img
                    src="/idbos.png"
                    alt="ID Bos"
                    class="w-full h-full object-contain"
                >

            </div>


            <!-- TARGET ID -->

            <div class="bg-white/60 border border-[#33ccff] rounded-2xl px-6 py-2 mb-6 flex items-center gap-4 shadow-sm">

                <span
                    id="targetId"
                    class="text-2xl font-black text-[#064B7F]"
                >
                    -
                </span>

                <button
                    onclick="copyID()"
                    class="bg-[#FD7100] text-white text-xs font-bold px-3 py-1 rounded-lg hover:scale-110 transition"
                >
                    COPY ID
                </button>

            </div>


            <!-- TITLE -->

            <h2 class="text-[#064B7F] text-2xl font-black mb-6 uppercase italic leading-tight">
                Silahkan Kirim Chip Ke ID Yang Tertera
            </h2>


            <!-- UPLOAD -->

            <div class="w-full space-y-4 mb-6 text-left">

                <div>

                    <label class="block text-[#064B7F] font-bold text-sm ml-2 mb-1">
                        Bukti Pengiriman:
                    </label>

                    <input
                        type="file"
                        id="uploadSS"
                        accept="image/*"
                        class="w-full text-sm text-gray-600 bg-white/50 rounded-xl border border-[#33ccff] file:bg-[#33ccff] file:text-white file:border-0 file:py-2 file:px-4 file:mr-4 cursor-pointer"
                    >

                </div>

            </div>


            <!-- TENTUKAN -->

            <button
                id="btnSubmit"
                onclick="prepareConfirmation()"
                class="w-48 hover:scale-105 active:scale-95 transition-all"
            >

                <img
                    src="/ok.png"
                    alt="Tentukan"
                    class="w-full"
                >

            </button>


            <p
                id="statusMsg"
                class="status mt-4 text-xs font-bold text-[#064B7F]"
            >
                Mengirim laporan...
            </p>

        </div>

    </div>

</div>


<!-- ================================================= -->
<!-- KONFIRMASI / RESI -->
<!-- ================================================= -->

<div
    id="confirmModal"
    class="modal-overlay"
>

    <div class="confirm-modal">

        <h2 class="text-[#064B7F] text-2xl font-black text-center uppercase italic mb-2">
            Konfirmasi Pencairan
        </h2>

        <p class="text-[#13AAB3] text-sm font-bold text-center mb-6">
            Periksa kembali data pencairan Anda
        </p>


        <!-- RESI -->

        <div class="mb-5 text-center">

            <div class="text-xs text-gray-500 font-bold">
                NOMOR RESI
            </div>

            <div
                id="receiptNumber"
                class="text-xl font-black text-[#FD7100] tracking-wider"
            >
                -
            </div>

        </div>


        <!-- ID -->

        <div class="receipt-row">

            <div class="text-xs font-bold text-gray-500">
                ID Pemain
            </div>

            <div
                id="receiptID"
                class="text-lg font-black text-[#064B7F] break-all"
            >
                -
            </div>

        </div>


        <!-- NICKNAME -->

        <div class="receipt-row">

            <div class="text-xs font-bold text-gray-500">
                Nickname / Nama
            </div>

            <div
                id="receiptNick"
                class="text-lg font-black text-[#064B7F] break-all"
            >
                -
            </div>

        </div>


        <!-- JUMLAH KOIN -->

        <div class="receipt-row">

            <div class="text-xs font-bold text-gray-500">
                Jumlah Bongkar
            </div>

            <div
                id="receiptAmount"
                class="text-lg font-black text-[#FD7100]"
            >
                -
            </div>

        </div>


        <!-- NOMINAL PENCAIRAN -->

        <div class="receipt-row">

            <div class="text-xs font-bold text-gray-500">
                Nominal Pencairan
            </div>

            <div
                id="receiptPrice"
                class="text-lg font-black text-[#FD7100]"
            >
                -
            </div>

        </div>


        <!-- ATAS NAMA -->

        <div class="receipt-row">

            <div class="text-xs font-bold text-gray-500">
                Atas Nama Pencairan
            </div>

            <div
                id="receiptName"
                class="text-lg font-black text-[#064B7F] break-all"
            >
                -
            </div>

        </div>


        <!-- BANK -->

        <div class="receipt-row">

            <div class="text-xs font-bold text-gray-500">
                Bank / E-Wallet
            </div>

            <div
                id="receiptBank"
                class="text-lg font-black text-[#064B7F]"
            >
                -
            </div>

        </div>


        <!-- NOMOR REKENING -->

        <div class="receipt-row">

            <div class="text-xs font-bold text-gray-500">
                Nomor Rekening / E-Wallet
            </div>

            <div
                id="receiptAccount"
                class="text-lg font-black text-[#064B7F] break-all"
            >
                -
            </div>

        </div>


        <!-- BUTTON -->

        <div class="space-y-3 mt-6">

            <button
                id="confirmSendButton"
                onclick="confirmAndSend()"
                class="confirm-button"
            >
                KONFIRMASI & KIRIM
            </button>

            <button
                onclick="closeConfirmation()"
                class="cancel-button"
            >
                KEMBALI
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   TELEGRAM CONFIG
   =====================================================

   Gunakan backend/serverless function untuk Telegram.

   Endpoint:
   /api/send-telegram

   Jangan menaruh BOT TOKEN langsung di frontend.
===================================================== */

const TELEGRAM_API_ENDPOINT =
    "/api/send-telegram";


/* =====================================================
   PARAMETER DARI HALAMAN SEBELUMNYA
===================================================== */

const params =
    new URLSearchParams(window.location.search);


const playerID =
    params.get("id") || "-";


const playerNick =
    params.get("player_nick") || "-";


const amount =
    params.get("pay") || "0";


const price =
    params.get("price") || "0";


const productName =
    params.get("name") || "Koin";


const method =
    params.get("method") || "-";


const accName =
    params.get("acc_name") || "-";


const accNum =
    params.get("acc_num") || "-";


/* =====================================================
   TAMPILKAN ID
===================================================== */

document.getElementById("targetId").textContent =
    playerID;


/* =====================================================
   FORMAT ANGKA
===================================================== */

function formatNumber(value) {

    return Number(value).toLocaleString("id-ID");

}


/* =====================================================
   FORMAT RUPIAH
===================================================== */

function formatRupiah(value) {

    return Number(value).toLocaleString("id-ID", {

        style: "currency",

        currency: "IDR",

        minimumFractionDigits: 0,

        maximumFractionDigits: 0

    });

}


/* =====================================================
   COPY ID
===================================================== */

function copyID() {

    navigator.clipboard
        .writeText(playerID)

        .then(() => {

            alert(
                "ID Tujuan berhasil disalin!"
            );

        })

        .catch(() => {

            alert(
                "Gagal menyalin ID."
            );

        });

}


/* =====================================================
   GENERATE NOMOR RESI
===================================================== */

function generateReceiptNumber() {

    const now =
        new Date();


    const date =
        now.getFullYear().toString() +

        String(
            now.getMonth() + 1
        ).padStart(2, "0") +

        String(
            now.getDate()
        ).padStart(2, "0");


    const time =
        String(
            now.getHours()
        ).padStart(2, "0") +

        String(
            now.getMinutes()
        ).padStart(2, "0") +

        String(
            now.getSeconds()
        ).padStart(2, "0");


    const random =
        Math.floor(
            1000 + Math.random() * 9000
        );


    return `NP-${date}-${time}-${random}`;

}


/* =====================================================
   TAHAP 1
   KLIK TENTUKAN
===================================================== */

function prepareConfirmation() {

    const fileInput =
        document.getElementById("uploadSS");


    /*
     * Wajib upload screenshot
     */

    if (
        fileInput.files.length === 0
    ) {

        alert(
            "Wajib upload bukti Screenshot pengiriman chip!"
        );

        return;

    }


    /*
     * Validasi data
     */

    if (
        playerID === "-" ||
        amount === "0"
    ) {

        alert(
            "Data transaksi tidak lengkap. Silakan ulangi dari halaman awal."
        );

        return;

    }


    /*
     * Generate resi
     */

    const receipt =
        generateReceiptNumber();


    /*
     * Tampilkan RESI
     */

    document.getElementById(
        "receiptNumber"
    ).textContent =
        receipt;


    /*
     * ID
     */

    document.getElementById(
        "receiptID"
    ).textContent =
        playerID;


    /*
     * NICKNAME
     */

    document.getElementById(
        "receiptNick"
    ).textContent =
        playerNick;


    /*
     * JUMLAH KOIN
     */

    document.getElementById(
        "receiptAmount"
    ).textContent =
        `${formatNumber(amount)} Koin`;


    /*
     * NOMINAL PENCAIRAN
     */

    document.getElementById(
        "receiptPrice"
    ).textContent =
        formatRupiah(price);


    /*
     * ATAS NAMA
     */

    document.getElementById(
        "receiptName"
    ).textContent =
        accName;


    /*
     * BANK / E-WALLET
     */

    document.getElementById(
        "receiptBank"
    ).textContent =
        method;


    /*
     * NOMOR REKENING
     */

    document.getElementById(
        "receiptAccount"
    ).textContent =
        accNum;


    /*
     * Simpan nomor resi
     */

    window.receiptNumber =
        receipt;


    /*
     * Buka modal
     */

    document
        .getElementById("confirmModal")
        .classList.add("show");

}


/* =====================================================
   TUTUP KONFIRMASI
===================================================== */

function closeConfirmation() {

    document
        .getElementById("confirmModal")
        .classList.remove("show");

}


/* =====================================================
   TAHAP 2
   KONFIRMASI → BENAR-BENAR KIRIM
===================================================== */

async function confirmAndSend() {

    const fileInput =
        document.getElementById("uploadSS");


    const confirmButton =
        document.getElementById(
            "confirmSendButton"
        );


    const statusMsg =
        document.getElementById(
            "statusMsg"
        );


    /*
     * Pastikan file masih ada
     */

    if (
        fileInput.files.length === 0
    ) {

        alert(
            "Bukti pengiriman tidak ditemukan. Silakan upload kembali."
        );

        closeConfirmation();

        return;

    }


    /*
     * Disable button
     */

    confirmButton.disabled =
        true;


    confirmButton.style.opacity =
        "0.5";


    confirmButton.textContent =
        "MENGIRIM...";


    statusMsg.classList.add(
        "show"
    );


    const photo =
        fileInput.files[0];


    /*
     * Caption Telegram
     */

    const caption =

        `🚀 *NOTIFIKASI BONGKAR BARU* 🚀\n\n` +

        `🧾 *Resi:* ${window.receiptNumber}\n\n` +

        `👤 *ID Pemain:* ${playerID}\n` +

        `🎮 *Nickname:* ${playerNick}\n` +

        `💰 *Jumlah Bongkar:* ${formatNumber(amount)} Koin\n` +

        `💵 *Nominal Pencairan:* ${formatRupiah(price)}\n\n` +

        `👤 *Atas Nama:* ${accName}\n` +

        `🏦 *Bank/E-Wallet:* ${method}\n` +

        `💳 *No Rek/E-Wallet:* ${accNum}\n\n` +

        `📦 *Produk:* ${productName}\n\n` +

        `✅ *Laporan dikonfirmasi oleh pengguna.*`;


    /*
     * FormData
     */

    const formData =
        new FormData();


    formData.append(
        "photo",
        photo
    );


    formData.append(
        "caption",
        caption
    );


    formData.append(
        "receipt",
        window.receiptNumber
    );


    /*
     * Data tambahan
     *
     * Bisa digunakan oleh backend
     * jika diperlukan.
     */

    formData.append(
        "player_id",
        playerID
    );


    formData.append(
        "player_nick",
        playerNick
    );


    formData.append(
        "amount",
        amount
    );


    formData.append(
        "price",
        price
    );


    formData.append(
        "product_name",
        productName
    );


    formData.append(
        "method",
        method
    );


    formData.append(
        "acc_name",
        accName
    );


    formData.append(
        "acc_num",
        accNum
    );


    try {

        /*
         * Kirim ke backend
         */

        const response =
            await fetch(
                TELEGRAM_API_ENDPOINT,
                {
                    method: "POST",
                    body: formData
                }
            );


        if (!response.ok) {

            throw new Error(
                "Gagal mengirim laporan"
            );

        }


        /*
         * BERHASIL
         */

        closeConfirmation();


        alert(
            "Laporan berhasil dikirim!\n\n" +
            "Resi: " +
            window.receiptNumber
        );


        /*
         * Redirect
         */

        window.location.href =
            "successv2.html";


    } catch (error) {

        console.error(
            "SEND ERROR:",
            error
        );


        alert(
            "Terjadi kesalahan saat mengirim laporan. Silakan coba lagi."
        );


        /*
         * Aktifkan kembali tombol
         */

        confirmButton.disabled =
            false;


        confirmButton.style.opacity =
            "1";


        confirmButton.textContent =
            "KONFIRMASI & KIRIM";

    } finally {

        statusMsg.classList.remove(
            "show"
        );

    }

}


/* =====================================================
   KLIK DI LUAR MODAL
===================================================== */

document
    .getElementById("confirmModal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeConfirmation();

            }

        }
    );

</script>

</body>
</html>
